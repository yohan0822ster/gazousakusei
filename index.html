<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Leaflet Test</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    #map { height: 400px; }
    #memos {
      margin-top: 10px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <!-- メモ一覧 -->
  <div id="memos"></div>
<script>
  const map = L.map('map').setView([35.68, 139.76], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  //  永続化されたメモを復元（最短3行）
  const list = JSON.parse(localStorage.getItem("memoList") || "[]");
  list.forEach(m => {
    L.marker([m.lat, m.lng]).addTo(map).bindPopup(m.memo);
  });
  // メモ一覧表示
 document.getElementById("memos").innerHTML = list.map(m => m.date + " " + m.lat + "," + m.lng + " " + m.memo).join("<br>");
  const locateControl = L.control({ position: 'topleft' });

  locateControl.onAdd = function () {
    const btn = L.DomUtil.create('button', '');
    btn.innerHTML = '🚩 現在地';

    btn.onclick = function () {
      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        L.marker([lat, lng]).addTo(map)
          .bindPopup('あなたの現在地')
          .openPopup();

        map.setView([lat, lng], 15);

        //  メモ追加（永続化3行だけ）
        const memo = prompt("この場所のメモを入力");
        if (memo) {
          L.marker([lat, lng]).addTo(map).bindPopup(memo);

          const list = JSON.parse(localStorage.getItem("memoList") || "[]");
          list.push({
             lat,
             lng,
             memo,
             date: new Date().toLocaleString()
          });
          localStorage.setItem("memoList", JSON.stringify(list));

        // ★一覧更新
          document.getElementById("memos").innerHTML = list.map(m => m.date + " " + m.lat + "," + m.lng + " " + m.memo).join("<br>");
        }
      });
    };

    return btn;
  };

  locateControl.addTo(map);
</script>

</body>
</html>
