<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Leaflet Test</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    #map { height: 400px; }
    #memos {
      margin-top: 10px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <!-- メモ一覧 -->
  <div id="memos"></div>
<script>
  const map = L.map('map').setView([35.68, 139.76], 13);

L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院タイル</a>'
}).addTo(map);


  //  永続化されたメモを復元（最短3行）
  const list = JSON.parse(localStorage.getItem("memoList") || "[]");
  list.forEach(m => {
    L.marker([m.lat, m.lng]).addTo(map).bindPopup(m.memo);
  });
  // メモ一覧表示
 document.getElementById("memos").innerHTML = list.map(m => m.date + " " + m.lat + "," + m.lng + " " + m.memo).join("<br>");
  const locateControl = L.control({ position: 'topleft' });

  locateControl.onAdd = function () {
    const btn = L.DomUtil.create('button', '');
    btn.innerHTML = '🚩 現在地';
//★asynを追加
    btn.onclick = function () {
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        L.marker([lat, lng]).addTo(map)
          .bindPopup('あなたの現在地')
          .openPopup();

        map.setView([lat, lng], 15);

        //  メモ追加（永続化3行だけ）
        const memo = prompt("この場所のメモを入力");

        
        if (memo) {
          L.marker([lat, lng]).addTo(map).bindPopup(memo);

          const list = JSON.parse(localStorage.getItem("memoList") || "[]");
          list.push({
             lat,
             lng,
             memo,
             date: new Date().toLocaleString()
          });
          localStorage.setItem("memoList", JSON.stringify(list));

        // ★一覧更新
          document.getElementById("memos").innerHTML = list.map(m => m.date + " " + m.lat + "," + m.lng + " " + m.memo).join("<br>");
        }
      });
    };

    return btn;
  };

  locateControl.addTo(map);



//★★Govデータ読み込み

// 全国自治体データ
let localgov = [];

fetch("https://code4fukui.github.io/localgovjp/localgovjp.json")
  .then(r => r.json())
  .then(j => {
    localgov = j;
    console.log("自治体データ読込完了", localgov.length);
  });



// AI中央GPSボタン
const aiControl = L.control({ position: 'topleft' });

aiControl.onAdd = function () {

  const btn = L.DomUtil.create('button', '');

  btn.innerHTML = '🤖 AI';

btn.onclick = async function () {

const center = map.getCenter();

const q = prompt("質問を入力");

if (!q) return;

const list = JSON.parse(
  localStorage.getItem("memoList") || "[]"
);


   // ★★最短距離
    const nearest = localgov.reduce((best, g) => {

      const d =
        (center.lat - Number(g.lat)) ** 2 +
        (center.lng - Number(g.lng)) ** 2;

      if (!best || d < best.d) {
        return { d, g };
      }

      return best;

    }, null);


  
const session = await LanguageModel.create({
  expectedOutputLanguages:["ja"]
});

const guide = await session.prompt(`
あなたは地図アシスタントです。

現在の地図中心は

緯度 ${center.lat}
経度 ${center.lng}

です。

現在地に最も近い自治体は

${nearest.g.pref}
${nearest.g.city}

です。

行動データを以下に保存してあります。日付、位置情報、メモのテキストが格納されています。

${JSON.stringify(list)}


全国自治体データも変数に保存してあります。
自治体データも参考にしながらべて取得して回答してください。


質問:
${q}
`);
  alert(guide);
};
  return btn;
};

aiControl.addTo(map);



  
// ひまわり雲画像
fetch("https://www.jma.go.jp/bosai/himawari/data/satimg/targetTimes_jp.json")
.then(r=>r.json())
.then(t=>{
  const d=t.at(-1);

  L.tileLayer(
    `https://www.jma.go.jp/bosai/himawari/data/satimg/${d.basetime}/jp/${d.validtime}/REP/ETC/{z}/{x}/{y}.jpg`,
    {
      opacity:0.4,
      attribution:'気象庁 ひまわり'
    }
  ).addTo(map);
});

  
  
</script>

</body>
</html>
